    <style>
        /* HORIZONTAL SCROLLING GALLERY CONTAINER */
        .gallery-wall {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: 50%;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            gap: 10px;
            padding: 10px;
            scrollbar-width: 10px; /* Hide scrollbar for cleaner look */
            scrollbar-color: #53D553 #323131;
        }

        /* GALLERY ITEM STYLING */
        .gallery-wall figure {
            position: relative;
            height: 400px;
            border: 1px solid #FFD700;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 1s ease-in, opacity 2s ease-in-out;
            opacity: 1;
        }

        .gallery-wall figure:hover{
            transform: scale(0.9) ;
            border: 3px solid #FFD700;
            padding: 10px;
            opacity: 2;
            
        }

        /* IMAGE STYLING */
        .gallery-wall img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            object-fit: cover; /* Ensure images maintain aspect ratio */
            z-index: 1;
            transition: z-index 2s ease-in-out, opacity 2s ease;
        }

        .gallery-wall figure:hover img{
            z-index: -1;
            opacity: 0.3;
        }

        /* TITLE STYLING (currently unused - consider adding to figcaption) */
        .gallery-wall img title {
            border-radius: 60px;
            background-color: #E6E6E6;
        }

        .gallery-wall figure > a{
            position: absolute;
            top: 15%;
            left: 0;
            text-align: center;
            padding: 10px;
            border: 1px solid #E6E6E6;
            margin: 10px;
            border-radius: 10px;
            color: #53D553;
            background-color: #2c2c2c;
            
        }

        .gallery-wall figure > a:hover{
            color: #FFD700;
        }
    </style>
</head>
