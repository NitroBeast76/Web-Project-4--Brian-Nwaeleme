    <!-- GALLERY SPECIFIC STYLES -->
    <style>
        /* HORIZONTAL SCROLLING GALLERY CONTAINER */
        .gallery-wall {
            display: -ms-grid; /* IE fallback for grid (limited support) */
            display: grid; /* Use CSS Grid for layout */
            -ms-grid-auto-flow: column; /* IE grid auto flow (very limited) */
            grid-auto-flow: column; /* Arrange grid items in columns */
            -ms-grid-auto-columns: 50%; /* IE fallback */
            grid-auto-columns: 50%; /* Each column is 50% width */
            overflow-x: auto; /* Enable horizontal scrolling */
            -webkit-overflow-scrolling: touch; /* Smooth scrolling on iOS */
            scroll-snap-type: x mandatory; /* Snap scrolling horizontally */
            -webkit-scroll-snap-type: x mandatory; /* Safari scroll snap */
            scroll-behavior: smooth; /* Smooth scroll animation */
            gap: 10px; /* Space between items */
            padding: 10px; /* Padding around gallery */
            scrollbar-width: thin; /* Firefox: thin scrollbar */
            scrollbar-color: #53D553 #323131; /* Firefox: scrollbar colors */
        }

        /* GALLERY ITEM STYLING */
        .gallery-wall figure {
            position: relative; /* For absolutely positioned children */
            height: 400px; /* Fixed height for gallery items */
            border: 1px solid #FFD700; /* Gold border */
            border-radius: 10px;
            -webkit-border-radius: 10px; /* Webkit prefix for border radius */
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); /* Subtle shadow */
            -webkit-box-shadow: 0 4px 8px rgba(0,0,0,0.2); /* Webkit prefix */
            transition: transform 1s ease-in, opacity 2s ease-in-out; /* Smooth transform/opacity */
            -webkit-transition: -webkit-transform 1s ease-in, opacity 2s ease-in-out; /* Webkit prefix */
            opacity: 1; /* Fully visible */
        }

        .gallery-wall figure:hover {
            transform: scale(0.9); /* Shrink on hover */
            -webkit-transform: scale(0.9); /* Webkit prefix */
            border: 3px solid #FFD700; /* Thicker border on hover */
            padding: 10px; /* Extra padding on hover */
            opacity: 1; /* Remain fully visible */
        }

        /* IMAGE STYLING */
        .gallery-wall img {
            position: absolute; /* Fill the figure */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            -webkit-border-radius: 10px; /* Webkit prefix */
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); /* Shadow for image */
            -webkit-box-shadow: 0 4px 8px rgba(0,0,0,0.2); /* Webkit prefix */
            object-fit: cover; /* Cover the container */
            -webkit-object-fit: cover; /* Webkit prefix */
            z-index: 1; /* Place above other elements */
            transition: z-index 2s ease-in-out, opacity 2s ease; /* Animate z-index/opacity */
            -webkit-transition: z-index 2s ease-in-out, opacity 2s ease; /* Webkit prefix */
        }

        .gallery-wall figure:hover img {
            z-index: -1; /* Move image behind on hover */
            opacity: 0.3; /* Fade image on hover */
        }

        /* TITLE STYLING (currently unused - consider adding to figcaption) */
        .gallery-wall img title {
            border-radius: 60px;
            background-color: #E6E6E6;
        }

        /* LINK INSIDE FIGURE */
        .gallery-wall figure > a {
            position: absolute; /* Overlay on image */
            top: 15%; /* Position from top */
            left: 0;
            text-align: center;
            padding: 10px;
            border: 1px solid #E6E6E6;
            margin: 10px;
            border-radius: 10px;
            -webkit-border-radius: 10px; /* Webkit prefix */
            color: #53D553; /* Green text */
            background-color: #2c2c2c; /* Dark background */
            transition: color 0.3s ease; /* Smooth color change */
            -webkit-transition: color 0.3s ease;
        }

        .gallery-wall figure > a:hover {
            color: #FFD700; /* Gold text on hover */
        }
    </style>
